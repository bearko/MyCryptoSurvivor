<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121018" />
  <title>MyCryptoSurvivor</title>

  <!-- OGP -->
  <meta property="og:title" content="MyCryptoSurvivor" />
  <meta property="og:description" content="MyCryptoSurvivor — choose a hero and survive the chain. A vanilla JS web game." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/og-image.png" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="720" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="assets/og-image.png" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2256%22>🏔️</text></svg>" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/effects.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ============================================================ -->
  <!-- 1. Splash (= boot 中) — SPEC-029: ロゴ画像化                    -->
  <!-- ============================================================ -->
  <div id="splash" class="splash">
    <img class="splash__logo" src="assets/logo.png" alt="MyCryptoSurvivors" />
    <div class="splash__loading" data-i18n="splash.loading">読み込み中…</div>
  </div>

  <!-- ============================================================ -->
  <!-- 2. Title screen (= SPEC-029 で画像ロゴ化)                       -->
  <!-- ============================================================ -->
  <section id="titleScreen" class="title-screen hidden">
    <h1 class="title-screen__title">
      <img class="title-screen__logo" src="assets/logo.png" alt="MyCryptoSurvivors" />
    </h1>
    <p class="title-screen__sub" data-i18n="title.subtitle">サバイバルがチェーンを駆ける。</p>

    <button id="btnPressStart" class="title-screen__press" data-i18n="title.press">
      Press to Start
    </button>

    <div class="lang-toggle" id="langToggle">
      <span class="lang-toggle-label" data-i18n="lang.toggle.label">Language / 言語</span>
      <div class="lang-toggle-buttons">
        <button class="lang-btn" data-lang="ja">JP：日本語</button>
        <button class="lang-btn" data-lang="en">EN：English</button>
      </div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- 3. Main app                                                    -->
  <!-- ============================================================ -->
  <main id="app" class="app hidden">
    <header class="header">
      <div class="header__left">
        <span class="header__title">MyCryptoSurvivor</span>
        <span class="header__hero-badge hidden" id="ownedHeroBadge"
              aria-live="polite"></span>
      </div>
      <div class="header__right">
        <button id="btnMenuOpen"   class="btn btn--ghost" title="Menu" aria-label="menu">☰</button>
        <button id="btnLangToggle" class="btn btn--ghost" title="Language">JP/EN</button>
        <button id="btnHelpOpen"   class="btn btn--ghost" title="Help">?</button>
      </div>
    </header>

    <!-- ============================================================ -->
    <!-- HUD: Level + Elapsed + HP + XP (= SPEC-005 VS slim)            -->
    <!-- ============================================================ -->
    <section class="hud" id="hud" aria-live="polite">
      <span class="hud__level"   id="hudLevel">Lv.1</span>
      <span class="hud__elapsed" id="hudElapsed" aria-label="elapsed time">00:00</span>
      <div class="hud__bar" id="hudHp" data-stat="hp" role="meter"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <span class="hud__bar-label" data-i18n="hud.stats.hp">HP</span>
        <span class="hud__bar-track"><span class="hud__bar-fill"></span></span>
        <span class="hud__bar-value">100</span>
      </div>
      <div class="hud__bar" id="hudXp" data-stat="xp" role="meter"
           aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <span class="hud__bar-label" data-i18n="hud.stats.xp">XP</span>
        <span class="hud__bar-track"><span class="hud__bar-fill"></span></span>
        <span class="hud__bar-value">0/5</span>
      </div>
    </section>

    <section class="stage">
      <canvas id="battleCanvas" class="battle-canvas" aria-label="battle stage"></canvas>
      <div id="joystick" class="joystick hidden" aria-hidden="true">
        <div class="joystick__base"  id="joystickBase"></div>
        <div class="joystick__stick" id="joystickStick"></div>
      </div>
    </section>
  </main>

  <!-- ============================================================ -->
  <!-- Stage transition modal (= SPEC-030)                           -->
  <!-- ============================================================ -->
  <div id="stageTransitionModal" class="gameover-modal hidden" role="dialog" aria-modal="true"
       aria-labelledby="stageTransitionTitle">
    <div class="gameover-modal__card">
      <h2 class="gameover-modal__title" id="stageTransitionTitle"
          data-i18n="stage.clearTitle">Stage Clear!</h2>
      <div class="gameover-modal__stats">
        <div class="gameover-stat" id="stageTransitionCurrent"></div>
        <div class="gameover-stat" id="stageTransitionSub"></div>
      </div>
      <button class="btn gameover-modal__retry" id="stageTransitionProceed"
              data-i18n="stage.proceed">次のステージへ</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Game Over modal (= SPEC-009)                                   -->
  <!-- ============================================================ -->
  <div id="gameOverModal" class="gameover-modal hidden" role="dialog" aria-modal="true"
       aria-labelledby="gameOverTitle">
    <div class="gameover-modal__card">
      <h2 class="gameover-modal__title" id="gameOverTitle" data-i18n="gameover.title">ゲームオーバー</h2>
      <div class="gameover-modal__stats">
        <div class="gameover-stat" id="gameOverElapsed"></div>
        <div class="gameover-stat" id="gameOverLevel"></div>
        <div class="gameover-stat" id="gameOverKills"></div>
      </div>
      <div class="gameover-modal__form">
        <label class="gameover-form__label" for="gameOverName" data-i18n="gameover.namelabel">プレイヤー名</label>
        <input class="gameover-form__input" id="gameOverName" type="text" maxlength="30" autocomplete="off" />
        <button class="btn btn--secondary" id="gameOverSubmit" data-i18n="gameover.submit">ランキングに送信</button>
        <p class="gameover-form__msg" id="gameOverMsg" aria-live="polite"></p>
      </div>
      <button class="btn gameover-modal__retry" id="gameOverRetry" data-i18n="gameover.retry">リトライ</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Pause menu modal (= SPEC-034)                                  -->
  <!-- ============================================================ -->
  <div id="pauseMenuModal" class="gameover-modal hidden" role="dialog" aria-modal="true"
       aria-labelledby="pauseMenuTitle">
    <div class="gameover-modal__card pause-menu__card">
      <h2 class="gameover-modal__title" id="pauseMenuTitle" data-i18n="menu.title">メニュー</h2>
      <div class="pause-menu__buttons">
        <button class="btn btn--secondary" id="pauseMenuRestart" data-i18n="menu.restart">ステージをはじめからやり直す</button>
        <button class="btn btn--secondary" id="pauseMenuToTitle" data-i18n="menu.toTitle">タイトルに戻る</button>
        <button class="btn"                id="pauseMenuClose"   data-i18n="menu.close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Activity Report modal (= SPEC-033 全ステージ clear 時)          -->
  <!-- ============================================================ -->
  <div id="activityReportModal" class="gameover-modal hidden" role="dialog" aria-modal="true"
       aria-labelledby="activityReportTitle">
    <div class="gameover-modal__card report-card">
      <h2 class="gameover-modal__title" id="activityReportTitle">活動レポート</h2>
      <div class="report-hero" id="activityReportHero"></div>
      <div class="report-stages-wrap">
        <table class="report-stages">
          <thead>
            <tr>
              <th data-i18n="report.col.stage">ステージ</th>
              <th data-i18n="report.col.time">時間</th>
              <th data-i18n="report.col.kills">撃破</th>
              <th data-i18n="report.col.level">Lv</th>
              <th data-i18n="report.col.exts">取得エクステ</th>
            </tr>
          </thead>
          <tbody id="activityReportStages"></tbody>
        </table>
      </div>
      <div class="report-totals" id="activityReportTotals"></div>
      <div class="gameover-modal__form">
        <label class="gameover-form__label" id="activityReportNameLabel" for="activityReportName">プレイヤー名</label>
        <input class="gameover-form__input" id="activityReportName" type="text" maxlength="30" autocomplete="off" />
        <button class="btn btn--secondary" id="activityReportSubmit">ランキングに送信</button>
        <p class="gameover-form__msg" id="activityReportMsg" aria-live="polite"></p>
      </div>
      <button class="btn gameover-modal__retry" id="activityReportRetry">リトライ</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Level-up modal (= SPEC-008、 starter pick + LV up)              -->
  <!-- ============================================================ -->
  <div id="levelUpModal" class="levelup-modal hidden" role="dialog" aria-modal="true"
       aria-labelledby="levelUpTitle">
    <div class="levelup-modal__card">
      <h2 class="levelup-modal__title" id="levelUpTitle" data-i18n="levelup.title">レベルアップ!</h2>
      <p class="levelup-modal__sub"   id="levelUpSub"   data-i18n="levelup.sub">強化を 1 つ選ぼう</p>
      <div class="levelup-modal__grid" id="levelUpGrid" role="listbox"></div>
      <!-- SPEC-023: リロール (= 1戦 2 回まで、 残数表示) -->
      <button class="btn btn--ghost levelup-modal__reroll" id="levelUpReroll"
              type="button" data-i18n="levelup.reroll">リロール (残 2)</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- 4. Hero select modal (= SPEC-001 Phase 1 mock)                 -->
  <!-- ============================================================ -->
  <div id="heroSelectModal" class="hero-modal hidden" role="dialog" aria-modal="true"
       aria-labelledby="heroSelectTitle">
    <div class="hero-modal__card">
      <header class="hero-modal__head">
        <h2 class="hero-modal__title" id="heroSelectTitle" data-i18n="hero.select.title">
          ヒーローを選ぶ
        </h2>
        <button class="hero-modal__close-x" id="heroSelectClose" aria-label="Close">×</button>
      </header>

      <!-- SPEC-014: 詳細パネル (= 上部、 選択中ヒーローの情報 + 担当 extension) -->
      <div class="hero-detail" id="heroDetail">
        <div class="hero-detail__placeholder" id="heroDetailPlaceholder"
             data-i18n="hero.detail.placeholder">ヒーローを選んでください</div>
        <div class="hero-detail__content hidden" id="heroDetailContent">
          <img class="hero-detail__portrait" id="heroDetailPortrait" alt=""
               onerror="this.classList.add('hero-detail__portrait--missing'); this.removeAttribute('src');" />
          <div class="hero-detail__info">
            <div class="hero-detail__name" id="heroDetailName"></div>
            <div class="hero-detail__sub"  id="heroDetailSub"></div>
            <div class="hero-detail__stats">
              <span class="hero-detail__stat" id="heroDetailHp"></span>
              <span class="hero-detail__stat" id="heroDetailSpeed"></span>
            </div>
          </div>
          <div class="hero-detail__weapon">
            <img class="hero-detail__weapon-icon" id="heroDetailWeaponIcon" alt=""
                 onerror="this.classList.add('hero-detail__weapon-icon--missing'); this.removeAttribute('src');" />
            <div class="hero-detail__weapon-info">
              <div class="hero-detail__weapon-label" data-i18n="hero.detail.starterWeapon">開始武器</div>
              <div class="hero-detail__weapon-name"  id="heroDetailWeaponName"></div>
              <div class="hero-detail__weapon-skill" id="heroDetailWeaponSkill"></div>
              <div class="hero-detail__weapon-desc"  id="heroDetailWeaponDesc"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="hero-modal__grid" id="heroSelectGrid"
           role="listbox" aria-label="Hero choices"></div>
      <p class="hero-modal__hint" id="heroSelectHint">
        <span id="heroSelectHintText" data-i18n="hero.select.empty">
          ヒーローを選択してください
        </span>
      </p>
      <button class="btn hero-modal__cta" id="heroSelectCta"
              data-i18n="hero.select.cta" disabled>
        冒険を始める
      </button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- 5. Help overlay                                               -->
  <!-- ============================================================ -->
  <div id="helpOverlay" class="help-overlay hidden">
    <div class="help-card">
      <h2 data-i18n="help.title">ヘルプ</h2>
      <p data-i18n="help.body">ゲームの遊び方をここに書く。</p>
      <p data-i18n="help.timeNote">ホーム画面で待機している間のみ時間が進行します。</p>
      <button id="btnHelpClose" class="btn" data-i18n="btn.close">閉じる</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- 6. Effect layers                                               -->
  <!-- ============================================================ -->
  <div id="confettiLayer" class="confetti-layer hidden"></div>
  <div id="floatLayer"    class="float-layer hidden"></div>
  <div id="notifLayer"    class="notif-layer"></div>

  <!-- ============================================================ -->
  <!-- 7. Boot                                                        -->
  <!-- ============================================================ -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
