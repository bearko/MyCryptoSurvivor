<!doctype html>
<!--
  SPEC-070: タイトルのロゴ (= assets/logo.png) の元。 これを背景の透けた PNG に書き出したものをゲームで使う。
  - エンブレム (= emblem.png) は SPEC-029 のロゴから円の中だけを切り出したもの (= 外は透明)
  - 書き出し: Chromium で開き、 #logo の要素を背景なし・2 倍で撮って、 光の外の透明を切りつめる
      例 (Playwright): page.locator('#logo').screenshot({ omitBackground: true }) を deviceScaleFactor: 2 で
  - 文字は Google Fonts (= ゲームと同じ Dela Gothic One・Chakra Petch)。 書き出す前に読み終わるのを待つ (= display=block)
  - ほかの作品のサムネイル (= 共通基盤の tools/thumbs) も assets/logo.png を参照している
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Dela+Gothic+One&display=block" />
<style>
:root { --cyan:#56ccf2; --gold:#c4a35a; --gold-hi:#f6e2a0; --pink:#ff4fd8; }
html,body{margin:0;background:transparent;}
body{display:flex;justify-content:center;padding:40px;}
.logo{display:inline-flex;flex-direction:column;align-items:center;padding:60px 56px 40px;}
.logo__emblem{width:112px;height:112px;border-radius:50%;padding:4px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 34%,var(--cyan) 72%);
  box-shadow:0 0 22px 3px rgba(86,204,242,.5),0 0 46px 8px rgba(255,79,216,.16);}
.logo__emblem img{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 3px #0d0a14;}
.logo__kicker{font-family:"Chakra Petch",monospace;font-weight:700;font-size:17px;letter-spacing:.56em;padding-left:.56em;color:var(--cyan);
  display:flex;align-items:center;gap:14px;text-shadow:0 0 8px rgba(86,204,242,.55),0 2px 2px rgba(0,0,0,.6);}
.logo__kicker::before,.logo__kicker::after{content:"";width:34px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan));box-shadow:0 0 6px rgba(86,204,242,.7);}
.logo__kicker::after{transform:scaleX(-1)}
.logo__main{margin-top:4px;font-family:"Dela Gothic One",sans-serif;font-size:58px;line-height:1.05;letter-spacing:.045em;color:#fff;
  text-shadow:-2.5px 0 rgba(255,79,216,.9),2.5px 0 rgba(86,204,242,.95),0 0 22px rgba(86,204,242,.4),0 4px 3px rgba(0,0,0,.55);}
.logo__rule{align-self:stretch;height:5px;margin:12px 6px 0;
  background:radial-gradient(circle,var(--cyan) 1.9px,transparent 2.4px) center/11px 5px repeat-x;
  filter:drop-shadow(0 0 4px rgba(86,204,242,.85));}
</style></head>
<body><div class="logo" id="logo" role="img" aria-label="MyCryptoSurvivors">
<div class="logo__emblem"><img src="emblem.png" alt=""></div>
<div class="logo__kicker">MYCRYPTO</div>
<div class="logo__main">SURVIVORS</div>
<div class="logo__rule"></div>
</div></body></html>
